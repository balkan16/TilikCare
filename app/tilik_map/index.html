<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root { --ink:#1a2233; --muted:#6b7280; --line:#eadfd8; --bg:#fbf7f3; --soft:#fce5dd; --brand:#ee5a3f; --brand2:#d9472d;
          --green:#16a34a; --orange:#ea580c; --gray:#6b7280; --sel:#1a2233; }
  body.dark { --ink:#e5e7eb; --muted:#9ca3af; --line:#374151; --bg:#0e1117; --soft:#1f2937; --sel:#f9fafb; }
  body.dark .card, body.dark a.btn, body.dark button.btn { background:#111827; }
  body.dark .pill { background:#111827; color:#f9fafb; } body.dark .pill.sel { background:#f9fafb; color:#111827; }
  body.dark .pill.hot { background:#1f2937; }
  body.dark .rlabel { color:#e2e8f0; text-shadow:0 0 3px #000, 0 0 3px #000; } body.dark .rlabel.d { color:#cbd5e1; }
  body.dark .hint { background:rgba(17,24,39,.95); }
  body.dark .ev-gray { background:#374151; color:#e5e7eb; }
  * { box-sizing: border-box; }
  #busy { display:none; position:fixed; left:50%; top:96px; transform:translateX(-50%); z-index:6000; background:var(--ink); color:#fff;
          border-radius:999px; padding:9px 18px; font:600 14px inherit; font-family:inherit; box-shadow:0 6px 18px rgba(0,0,0,.25);
          align-items:center; gap:10px; }
  #busy i { width:14px; height:14px; border:2.5px solid rgba(255,255,255,.35); border-top-color:#fff; border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  body.busy #busy { display:flex; }
  body.busy #left, body.busy #map { opacity:.55; transition:opacity .2s; }
  html, body { margin:0; height:100%; font-family: "Inter", "Source Sans Pro", -apple-system, "Segoe UI", sans-serif; color:var(--ink); background:var(--bg); }
  #page { display:flex; flex-direction:column; height:100%; position:relative; }
  #wrap { display:flex; flex:1; min-height:0; gap:16px; }
  #left { width:46%; min-width:360px; overflow-y:auto; padding:4px 6px 24px 2px; }
  #right { flex:1; position:relative; }
  #map { position:absolute; inset:0; border-radius:16px; overflow:hidden; border:1px solid var(--line); background:#f3ede6; }
  .hint { position:absolute; left:12px; bottom:12px; z-index:500; background:rgba(255,255,255,.95); border:1px solid var(--line);
          border-radius:999px; padding:6px 12px; font-size:12.5px; color:var(--muted); box-shadow:0 2px 8px rgba(0,0,0,.08); }
  h2 { font-size:22px; margin:6px 0 2px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:14px; }
  .empty { margin-top:40px; color:var(--muted); font-size:15px; line-height:1.5; }
  .empty b { color:var(--ink); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(270px, 1fr)); gap:14px; }
  .card { border:1px solid var(--line); border-radius:16px; padding:14px; cursor:pointer; background:#fff;
          transition: box-shadow .15s, transform .15s, border-color .15s; }
  .card:hover, .card.hot { box-shadow:0 6px 20px rgba(0,0,0,.12); transform:translateY(-2px); border-color:#cbd5e1; }
  .card.sel { border:2px solid var(--sel); }
  .row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .rank { font-size:12px; color:var(--muted); }
  .name { font-weight:700; font-size:15.5px; margin:2px 0 4px; line-height:1.25; }
  .addr { font-size:12.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .meta { font-size:13.5px; margin:8px 0 6px; }
  .chip { display:inline-block; font-size:12px; padding:2px 8px; border-radius:999px; font-weight:600; }
  .ev-green { background:#dcfce7; color:#166534; } .ev-orange { background:#ffedd5; color:#9a3412; } .ev-gray { background:#f3f4f6; color:#374151; }
  .warn { background:#fef3c7; color:#92400e; font-weight:500; }
  .quote { font-size:13px; color:#374151; font-style:italic; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; margin-top:6px; }
  .btns { display:flex; gap:8px; margin-top:10px; }
  a.btn, button.btn { flex:1; text-align:center; text-decoration:none; font-size:13px; font-weight:600; padding:8px 10px; border-radius:10px;
          border:1px solid var(--ink); color:var(--ink); background:#fff; cursor:pointer; font-family:inherit; }
  a.btn.primary { background:var(--brand); border-color:var(--brand); color:#fff; }
  a.btn.off { opacity:.35; pointer-events:none; }
  /* detail view */
  .back { border:none; background:none; font-size:14px; font-weight:600; cursor:pointer; padding:6px 0; color:var(--ink); font-family:inherit; }
  .dname { font-size:24px; font-weight:700; margin:4px 0; }
  .facts { display:flex; gap:10px; flex-wrap:wrap; margin:12px 0; }
  .fact { border:1px solid var(--line); border-radius:12px; padding:8px 12px; min-width:110px; }
  .fact .v { font-size:18px; font-weight:700; } .fact .l { font-size:12px; color:var(--muted); }
  .sect { margin-top:16px; } .sect h4 { margin:0 0 6px; font-size:15px; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .box { border-radius:10px; padding:8px 12px; font-size:13px; } .box ul { margin:4px 0 0; padding-left:18px; }
  .plus { background:rgba(34,197,94,.10); border:1px solid rgba(34,197,94,.45); } .plus b { color:#15803d; }
  .minus { background:rgba(239,68,68,.08); border:1px solid rgba(239,68,68,.40); } .minus b { color:#b91c1c; }
  .cl-head { font-size:14px; margin:2px 0 8px; }
  .cl { border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .cl-row { display:flex; gap:10px; padding:10px 12px; border-top:1px solid var(--line); }
  .cl-row:first-child { border-top:none; }
  .cl-ic { width:22px; height:22px; border-radius:50%; flex:0 0 22px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; }
  .cl-row.yes .cl-ic { background:#dcfce7; color:#15803d; } .cl-row.no .cl-ic { background:#f3f4f6; color:#9ca3af; }
  .cl-row.no .cl-q { color:var(--muted); }
  .cl-q { font-weight:600; font-size:14px; }
  .cl-ev { margin:4px 0 0; padding-left:16px; font-size:13px; color:#15803d; } .cl-ev a { color:#2563eb; }
  .cl-warn { margin-top:10px; background:rgba(239,68,68,.06); border:1px solid rgba(239,68,68,.40); border-radius:10px; padding:8px 12px; font-size:13px; color:#1a2233; }
  .cl-warn b { color:#b91c1c; }
  .cl-warn ul { margin:4px 0 0; padding-left:18px; }
  /* all nearby options table */
  .tw { border:1px solid var(--line); border-radius:12px; overflow:auto; max-height:420px; }
  table.opts { border-collapse:collapse; font-size:13px; min-width:760px; width:100%; }
  table.opts th { position:sticky; top:0; background:#f3e9e3; text-align:left; font-weight:600; padding:8px 10px; white-space:nowrap; z-index:1; }
  table.opts td { padding:7px 10px; border-top:1px solid var(--line); white-space:nowrap; vertical-align:middle; }
  table.opts tr.o { cursor:pointer; } table.opts tr.o:hover td { background:#fdf1ec; }
  table.opts tr.cur td { background:#fce5dd; font-weight:600; }
  table.opts td.num { text-align:right; font-variant-numeric:tabular-nums; }
  table.opts td.why { max-width:340px; overflow:hidden; text-overflow:ellipsis; color:#4b5563; }
  .evb { display:inline-flex; align-items:center; gap:6px; } .evb i { display:block; width:70px; height:6px; border-radius:3px; background:#eee3dc; overflow:hidden; }
  .evb i b { display:block; height:100%; background:var(--brand); }
  /* ---- top search bar ---- */
  #top { padding:4px 2px 10px; }
  .bar-row { display:flex; align-items:center; gap:14px; }
  .logo { display:flex; align-items:center; gap:8px; min-width:200px; }
  .logo .wm { font-size:25px; font-weight:800; letter-spacing:-.3px; line-height:1; color:var(--ink); }
  .logo .wm b { color:var(--brand); font-weight:800; }
  .logo .tg { display:block; font-size:11.5px; font-weight:600; color:var(--ink); margin-top:3px; letter-spacing:.1px; }
  .sbar { flex:1; display:flex; align-items:center; background:#f3e9e3; border:1px solid #eadfd8; border-radius:999px; padding:0; max-width:900px;
          box-shadow:0 3px 12px rgba(0,0,0,.08); }
  .seg { flex:1; position:relative; padding:10px 36px 10px 28px; border-radius:999px; cursor:text; min-width:0; }
  .seg:hover { background:#ead9d0; }
  .seg.active { background:#fff; box-shadow:0 6px 20px rgba(0,0,0,.15); }
  .seg + .seg:before { content:""; position:absolute; left:0; top:22%; height:56%; border-left:1px solid #c9c9c9; }
  .seg.active:before, .seg.active + .seg:before { display:none; }
  .seg label { display:block; font-size:12.5px; font-weight:700; color:#222; cursor:text; }
  .seg input { width:100%; border:none; outline:none; background:transparent; font:400 15px inherit; font-family:inherit; color:#222; padding:2px 0 0; }
  .seg input::placeholder { color:#717171; }
  .x { position:absolute; right:10px; top:50%; transform:translateY(-50%); width:24px; height:24px; border-radius:50%; border:none;
       background:#dddddd; color:#222; font-size:16px; line-height:1; cursor:pointer; display:none; }
  .seg.has .x { display:block; }
  .go { display:flex; align-items:center; gap:8px; margin:6px; background:var(--brand); color:#fff; border:none; border-radius:999px;
        padding:12px 20px; font:700 15px inherit; font-family:inherit; cursor:pointer; white-space:nowrap; }
  .go:hover { background:var(--brand2); }
  .filt { display:flex; align-items:center; gap:8px; border:1px solid #dddddd; background:#fff; color:#222; border-radius:999px;
          padding:12px 18px; font:600 14px inherit; font-family:inherit; cursor:pointer; white-space:nowrap; }
  .filt.on { border:2px solid var(--brand); color:var(--brand); }
  .dd { position:absolute; top:76px; z-index:5000; background:#fff; border-radius:28px; box-shadow:0 8px 28px rgba(0,0,0,.22);
        padding:14px 10px; max-height:520px; overflow-y:auto; width:470px; }
  .dd.hidden, .fp.hidden { display:none; }
  .dd .ttl { font-size:12.5px; color:#222; font-weight:600; padding:8px 18px 4px; }
  .opt { display:flex; align-items:center; gap:16px; padding:10px 18px; border-radius:14px; cursor:pointer; }
  .opt:hover, .opt.kb { background:#f2f2f2; }
  .ico { width:52px; height:52px; flex:0 0 52px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:26px; }
  .opt .t { font-size:15px; color:#222; font-weight:500; } .opt .s { font-size:13.5px; color:#717171; margin-top:2px; }
  .fp { position:absolute; top:76px; right:0; z-index:5000; background:#fff; border-radius:20px; box-shadow:0 8px 28px rgba(0,0,0,.22);
        padding:18px 20px; width:360px; font-size:14px; }
  .fp h5 { margin:12px 0 8px; font-size:14px; } .fp h5:first-child { margin-top:0; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chipb { border:1px solid #dddddd; background:#fff; border-radius:999px; padding:6px 14px; cursor:pointer; font:500 13.5px inherit; font-family:inherit; color:#222; }
  .chipb.on { background:var(--brand); color:#fff; border-color:var(--brand); }
  .fp .row2 { display:flex; justify-content:space-between; align-items:center; margin-top:14px; gap:10px; }
  .fp .apply { background:var(--ink); color:#fff; border:none; border-radius:10px; padding:10px 18px; font:600 14px inherit; font-family:inherit; cursor:pointer; }
  .fp .clear { background:none; border:none; text-decoration:underline; cursor:pointer; font:600 14px inherit; font-family:inherit; color:#222; }
  #readas { font-size:13px; color:#484848; margin:10px 2px 0; min-height:18px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  #readas .tag { background:var(--soft); color:var(--brand2); border-radius:999px; padding:3px 10px; font-weight:600; }
  #readas .warnline { color:#b45309; }
  #rquote { display:inline-flex; align-items:center; gap:6px; } #rquote .rq { color:#1a2233; font-style:italic; }
  #rquote .rqa { color:#2563eb; display:inline-flex; } #rquote .rqa:hover { color:#1d4ed8; }
  #readas button { border:1px solid var(--brand); color:var(--brand2); background:#fff; border-radius:999px; padding:3px 10px; cursor:pointer; font:600 12.5px inherit; font-family:inherit; }
  body.dark .sbar { background:#1f2937; border-color:#374151; } body.dark .seg:hover { background:#374151; }
  body.dark .seg.active, body.dark .dd, body.dark .fp, body.dark .filt, body.dark .chipb { background:#111827; color:#e5e7eb; }
  body.dark .seg label, body.dark .seg input, body.dark .opt .t, body.dark .dd .ttl { color:#e5e7eb; }
  body.dark .opt:hover, body.dark .opt.kb { background:#1f2937; }
  blockquote { margin:6px 0; padding:8px 12px; border-left:3px solid var(--brand); background:var(--soft); font-size:13.5px; border-radius:0 8px 8px 0; }
  details { border:1px solid var(--line); border-radius:10px; padding:6px 10px; margin-top:6px; font-size:13px; }
  details summary { cursor:pointer; font-weight:600; }
  details li.hit { color:#15803d; font-weight:600; }
  details li.qhit { background:#fce5dd; border-radius:4px; }
  .lsearch { width:100%; box-sizing:border-box; border:1px solid var(--line); border-radius:999px; padding:8px 14px; font:14px inherit; font-family:inherit; margin:2px 0 4px; background:#fff; outline:none; }
  .lsearch:focus { border-color:var(--brand); }
  .small { font-size:12px; color:var(--muted); }
  /* map pins */
  .pill { background:#fff; color:var(--ink); border-radius:999px; padding:5px 12px; font:800 14px "Inter","Source Sans Pro",sans-serif; border-width:3px !important; box-shadow:0 2px 8px rgba(26,34,51,.35) !important;
          box-shadow:0 2px 6px rgba(0,0,0,.25); white-space:nowrap; border:2px solid var(--gray); transform:translate(-50%,-50%);
          position:absolute; transition: transform .12s, background .12s; }
  .pill.g { border-color:var(--green); } .pill.o { border-color:var(--orange); }
  .pill.hot { transform:translate(-50%,-50%) scale(1.15); background:#f1f5f9; z-index:1000; }
  .pill.sel { background:var(--sel); color:#fff; border-color:var(--sel); }
  .pt { width:16px; height:16px; border-radius:50%; background:#2563eb; border:3px solid #fff; box-shadow:0 0 0 2px #2563eb, 0 2px 6px rgba(0,0,0,.3); transform:translate(-50%,-50%); position:absolute; }
  .rlabel { background:transparent; border:none; box-shadow:none; font:700 11px "Source Sans Pro",sans-serif; color:#334155;
            text-shadow:0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff; }
  .rlabel.d { font-weight:600; font-size:10.5px; color:#475569; }
  .rlabel.city { font-size:14px; font-weight:800; color:#b45309; }
  .leaflet-tooltip.rlabel:before { display:none; }
</style>
</head>
<body>
<div id="busy"><i></i>Finding care near the patient...</div>
<div id="page">
  <div id="top">
    <div class="bar-row">
      <div class="logo"><svg viewBox="0 0 48 44" width="40" height="37" aria-hidden="true"><path d="M24 40 C10 30 3 22 3 13.5 C3 7.5 7.8 3 13.6 3 C18 3 21.6 5.6 24 9.4 C26.4 5.6 30 3 34.4 3 C40.2 3 45 7.5 45 13.5 C45 22 38 30 24 40 Z" fill="none" stroke="#ee5a3f" stroke-width="4.2" stroke-linejoin="round"/><path d="M21 14h6v5h5v6h-5v5h-6v-5h-5v-6h5z" fill="#ee5a3f"/></svg><div><div class="wm"><b>Tilik</b>Care</div><span class="tg">Find. Verify. Better.</span></div></div>
      <div class="sbar" id="sbar">
        <div class="seg" id="segNeed"><label for="inNeed">What care</label><input id="inNeed" autocomplete="off" placeholder="Service, or describe the case"><button class="x" id="xNeed" title="Clear">&times;</button></div>
        <div class="seg" id="segWhere"><label for="inWhere">Where</label><input id="inWhere" autocomplete="off" placeholder="Place, PIN or lat, lon"><button class="x" id="xWhere" title="Clear">&times;</button></div>
        <button class="go" id="go"><svg viewBox="0 0 24 24" width="18" height="18"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="#fff" stroke-width="2.6"/><path d="M15.5 15.5 21 21" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg><span>Search</span></button>
      </div>
      <button class="filt" id="filt"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="7" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="17" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/></svg><span id="filtLbl">Filters</span></button>
    </div>
    <div id="readas"></div>
    <div id="dd" class="dd hidden"></div>
    <div id="fp" class="fp hidden"></div>
  </div>
  <div id="wrap"><div id="left"></div><div id="right"><div id="map"></div><div class="hint" id="hint"></div></div></div>
</div>
<script>
// ---------------- Streamlit component protocol (no build step) ----------------
function send(type, data) { window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), "*"); }
function setValue(v) {  // every action shows "Loading..." until the app answers with a new render
  if (v && v.kind !== "home") {
    document.body.classList.add("busy");
    clearTimeout(window.__busyT); window.__busyT = setTimeout(() => document.body.classList.remove("busy"), 60000);  // never stuck
  }
  send("streamlit:setComponentValue", { value: v, dataType: "json" });
}
function fitHeight() {
  let h = 800;
  try { const top = window.frameElement.getBoundingClientRect().top; h = Math.max(420, window.parent.innerHeight - top - 12); } catch (e) {}
  if (Math.abs(h - (window.__h || 0)) > 2) { window.__h = h; send("streamlit:setFrameHeight", { height: h }); }
}

// ---------------- Map setup ----------------
const map = L.map("map", { zoomControl: true, minZoom: 4, zoomSnap: 0.25, zoomDelta: 0.5, maxBounds: [[4, 64], [39, 101]], maxBoundsViscosity: 1.0 })
  .setView([22.5, 81], 5);
const ESRI = "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}";  // roads, parks, towns
let tiles = null, dark = null;
function setTheme(isDark) {
  if (isDark === dark) return; dark = isDark;
  document.body.classList.toggle("dark", isDark);
  if (tiles) map.removeLayer(tiles);
  tiles = L.tileLayer(ESRI,
    { attribution: "Tiles &copy; Esri, HERE, Garmin, OpenStreetMap contributors", maxZoom: 18, opacity: 1 }).addTo(map);
  if (maskLayer) maskLayer.setStyle({ fillColor: isDark ? "#0e1117" : "#f3ede6" });
  fadeTiles();
}
let maskLayer = null, baseLayer = null, focusLayer = null, focusName = null;
// Landing-page look: zoomed out = plain white states on beige (no street map); zoomed in = street map fades in.
function fadeTiles() {
  // Street map is always visible; the patient's state keeps a light tint so it still stands out.
  if (tiles) tiles.setOpacity(1);
  if (baseLayer) baseLayer.setStyle({ fillOpacity: 0 });
  if (focusLayer) focusLayer.setStyle({ fillOpacity: 0.18 });
}
// "Reset map" control under the zoom buttons: back to the whole of India (keeps the search and results)
const ResetCtl = L.Control.extend({ options: { position: "topleft" }, onAdd: function () {
  const d = L.DomUtil.create("div", "leaflet-bar");
  d.innerHTML = "<a href='#' title='Start over: clear the search and show all of India' role='button' aria-label='Reset map' " +
    "style='font-size:17px;font-weight:700;line-height:30px'>&#10226;</a>";
  L.DomEvent.disableClickPropagation(d);
  d.firstChild.addEventListener("click", ev => {  // back to the first view: empty search, no pin, all of India
    ev.preventDefault(); map.closePopup(); detailId = null;
    need.text = ""; need.value = null; where.text = ""; where.value = null; setSeg("need"); setSeg("where"); closeDD();
    map.fitBounds(INDIA, { padding: [10, 10] });
    setValue({ kind: "reset", t: Date.now() }); });
  return d; } });
map.createPane("mask"); map.getPane("mask").style.zIndex = 390;
map.createPane("regions"); map.getPane("regions").style.zIndex = 400;
map.createPane("base"); map.getPane("base").style.zIndex = 380;
map.createPane("focus"); map.getPane("focus").style.zIndex = 405; map.getPane("focus").style.pointerEvents = "none";

let S = {};
const INDIA = [[6.5, 68], [35.7, 97.4]];
new ResetCtl().addTo(map);               // latest args from Python
let states = null, districts = null, stateLayer = null, distLayer = null, stateLabels = L.layerGroup(), distLabels = L.layerGroup();
let pointsLayer = L.layerGroup().addTo(map), pinsLayer = L.layerGroup().addTo(map), routeLayer = L.layerGroup().addTo(map), originLayer = L.layerGroup().addTo(map);
let pinById = {}, lastFitKey = null, detailId = null;

const COLORS = { g: "#16a34a", o: "#ea580c", x: "#6b7280" };
const evClass = s => s >= 3 ? "g" : s >= 2 ? "o" : "x";
const chipClass = s => s >= 3 ? "ev-green" : s >= 2 ? "ev-orange" : "ev-gray";
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const gmaps = (o, d) => "https://www.google.com/maps/dir/?api=1&origin=" + o[0] + "," + o[1] + "&destination=" + d[0] + "," + d[1] + "&travelmode=driving";

function regionStyle(counts, top, f) {
  const n = counts ? (counts[f.properties.__i] || 0) : 0;
  return { pane: "regions", color: "#64748b", weight: 0.9, opacity: 0.7, fillColor: "#ee5a3f",
           fillOpacity: S.service ? 0.03 + 0.4 * n / (top || 1) : 0 };
}

function whereItems(t) {
  const q = t.trim(), ql = q.toLowerCase(), out = [];
  out.push({ html: icon("<svg viewBox='0 0 24 24' width='24' height='24'><path d='M3 11 21 3l-8 18-2-8z' fill='none' stroke='#2563eb' stroke-width='2' stroke-linejoin='round'/></svg>", "#eff6ff"),
             t: "Nearby", s: "Use my current location", kind: "geo" });
  const m = q.match(COORD);
  if (m && inIndia(+m[1], +m[2])) out.push({ html: icon("🧭", "#f1f5f9"), t: "Coordinates " + (+m[1]) + ", " + (+m[2]), s: "Exact point", v: "coords:" + (+m[1]) + "," + (+m[2]), kind: "where" });
  if (/^\d{6}$/.test(q)) out.push({ html: icon("🏷️", "#f1f5f9"), t: "PIN " + q, s: "Postal code centre", v: q, kind: "where" });
  const recent = (S.recent || []).filter(r => !ql || (r[0] + " " + r[2]).toLowerCase().includes(ql)).slice(0, 3);
  if (recent.length && !m) { out.push({ ttl: "Recent searches" });
    recent.forEach(r => out.push({ html: icon("🕘", "#f5f5f4"), t: r[2], s: r[0], v: r[1], need: r[0], kind: "recent" })); }
  if (!m && !/^\d{6}$/.test(q)) {
    const places = S.places || [];
    const starts = places.filter(p => ql && p.toLowerCase().split("|").pop().trim().startsWith(ql));
    const cont = places.filter(p => ql && !starts.includes(p) && p.toLowerCase().includes(ql));
    const list = ql ? starts.concat(cont).slice(0, 8) : (S.suggest_places || []).slice(0, 6);
    if (list.length) out.push({ ttl: ql ? "Places" : "Suggested places" });
    const tiles = [["🏙️", "#ecfdf5"], ["🏛️", "#f5f5f4"], ["🌆", "#fdf2f8"], ["🏘️", "#eff6ff"]];
    list.forEach((p, i) => { const nm = p.split("|").pop().trim(), kindTxt = p.split("|")[0].trim();
      out.push({ html: icon(tiles[i % 4][0], tiles[i % 4][1]), t: nm, s: kindTxt, v: p, kind: "where" }); });
  }
  return out;
}
function openDD(which) {
  active = which; $("fp").classList.add("hidden");
  $("segNeed").classList.toggle("active", which === "need"); $("segWhere").classList.toggle("active", which === "where");
  items = which === "need" ? needItems($("inNeed").value) : whereItems($("inWhere").value);
  // Enter picks the first real match; "Nearby" is only the default when nothing is typed
  const typed = (which === "need" ? $("inNeed") : $("inWhere")).value.trim();
  kb = items.findIndex(x => x.kind && !(typed && x.kind === "geo"));
  if (kb < 0) kb = items.findIndex(x => x.kind);
  const dd = $("dd");
  dd.innerHTML = items.map((x, i) => x.ttl !== undefined && !x.kind ? "<div class='ttl'>" + esc(x.ttl) + "</div>"
    : "<div class='opt" + (i === kb ? " kb" : "") + "' data-i='" + i + "'>" + x.html + "<div><div class='t'>" + esc(x.t) + "</div><div class='s'>" + esc(x.s || "") + "</div></div></div>").join("");
  dd.querySelectorAll(".opt").forEach(o => o.addEventListener("mousedown", ev => { ev.preventDefault(); pick(items[+o.dataset.i]); }));
  const seg = $(which === "need" ? "segNeed" : "segWhere");
  dd.style.left = (seg.getBoundingClientRect().left - $("page").getBoundingClientRect().left) + "px";
  dd.classList.toggle("hidden", !items.some(x => x.kind));
}
function closeDD() { active = null; $("dd").classList.add("hidden"); $("segNeed").classList.remove("active"); $("segWhere").classList.remove("active"); }
function setSeg(which) {
  const st = which === "need" ? need : where;
  $(which === "need" ? "inNeed" : "inWhere").value = st.text;
  $(which === "need" ? "segNeed" : "segWhere").classList.toggle("has", !!st.text);
}
function submit() {
  closeDD();
  if (!need.value && $("inNeed").value.trim()) need.value = need.text = $("inNeed").value.trim();
  if (!where.value && $("inWhere").value.trim()) { const q = $("inWhere").value.trim(), m = q.match(COORD);
    where.value = m ? "coords:" + (+m[1]) + "," + (+m[2]) : q; where.text = q; }
  setValue({ kind: "search", service: need.value, place: where.value, place_text: where.text, t: Date.now() });
}
function pick(x) {
  if (x.kind === "need") { need.text = x.t === "Describe the case" ? x.v : x.t; need.value = x.v; setSeg("need");
    if (!where.value) { $("inWhere").focus(); openDD("where"); } else submit(); return; }
  if (x.kind === "where" || x.kind === "recent") {
    where.text = x.t; where.value = x.v; setSeg("where");
    if (x.kind === "recent") { need.text = need.value = x.need; setSeg("need"); }
    if (need.value) submit(); else { $("inNeed").focus(); openDD("need"); } return; }
  if (x.kind === "geo") {
    where.text = "Finding your location..."; setSeg("where"); closeDD();
    if (!navigator.geolocation) { where.text = ""; setSeg("where"); alertLine("This browser cannot share its location. Type a place instead."); return; }
    navigator.geolocation.getCurrentPosition(pos => {
      const a = +pos.coords.latitude.toFixed(5), b = +pos.coords.longitude.toFixed(5);
      if (!inIndia(a, b)) { where.text = ""; where.value = null; setSeg("where"); alertLine("Your location (" + a + ", " + b + ") is outside India. Type a place in India instead."); return; }
      where.text = "Your current location"; where.value = "coords:" + a + "," + b; setSeg("where");
      if (need.value) submit(); else { $("inNeed").focus(); openDD("need"); }
    }, () => { where.text = ""; where.value = null; setSeg("where"); alertLine("Location permission was not given. Type a place, or right-click the map."); },
    { enableHighAccuracy: false, timeout: 10000 });
  }
}
function alertLine(msg) { $("readas").innerHTML = "<span class='warnline'>" + esc(msg) + "</span>"; }
["Need", "Where"].forEach(k => {
  const inp = $("in" + k), which = k.toLowerCase(), st = which === "need" ? need : where;
  inp.addEventListener("focus", () => openDD(which));
  inp.addEventListener("input", () => { st.text = inp.value; st.value = null; $("seg" + k).classList.toggle("has", !!inp.value); openDD(which); });
  inp.addEventListener("keydown", ev => {
    const opts = items.map((x, i) => x.kind ? i : -1).filter(i => i >= 0);
    if (ev.key === "ArrowDown" || ev.key === "ArrowUp") { ev.preventDefault(); const p = opts.indexOf(kb);
      kb = opts[(p + (ev.key === "ArrowDown" ? 1 : opts.length - 1)) % opts.length];
      $("dd").querySelectorAll(".opt").forEach(o => o.classList.toggle("kb", +o.dataset.i === kb)); }
    if (ev.key === "Enter") { ev.preventDefault(); if (!$("dd").classList.contains("hidden") && kb >= 0) pick(items[kb]); else submit(); }
    if (ev.key === "Escape") closeDD();
  });
  $("seg" + k).addEventListener("click", () => inp.focus());
  $("x" + k).addEventListener("click", ev => { ev.stopPropagation(); st.text = ""; st.value = null; setSeg(which);
    if (which === "where") setValue({ kind: "search", service: need.value, place: null, t: Date.now() }); else { inp.focus(); } });
});
$("go").addEventListener("click", submit);
document.querySelector(".logo").style.cursor = "pointer";
document.querySelector(".logo").title = "Back to the TilikCare home page";
document.querySelector(".logo").addEventListener("click", () => setValue({ kind: "home", t: Date.now() }));
document.addEventListener("mousedown", ev => {
  if (!ev.target.closest("#dd") && !ev.target.closest(".seg")) closeDD();
  if (!ev.target.closest("#fp") && !ev.target.closest("#filt")) $("fp").classList.add("hidden");
});
// Filters panel
function drawFilters() {
  const f = filters, chip = (grp, v, lbl, on) => "<button class='chipb" + (on ? " on" : "") + "' data-g='" + grp + "' data-v='" + v + "'>" + lbl + "</button>";
  $("fp").innerHTML =
    "<h5>Minimum text evidence</h5><div class='chips'>" + [0, 1, 2, 3, 4].map(v => chip("ev", v, v ? v + "+/4" : "Any", f.min_ev === v)).join("") + "</div>" +
    "<h5>Maximum distance (straight-line)</h5><div class='chips'>" + [10, 25, 50, 100, 300].map(v => chip("km", v, v === 300 ? "Any" : v + " km", f.max_km === v)).join("") + "</div>" +
    "<h5>Order</h5><div class='chips'>" + chip("ord", "near", "Nearest first", f.order === "near") + chip("ord", "ev", "Stronger evidence first", f.order === "ev") + "</div>" +
    "<h5>AI check</h5><div class='chips'>" + chip("unc", 0, "Show all", !f.hide_unclear) + chip("unc", 1, "Hide “unclear”", f.hide_unclear) + "</div>" +
    "<div class='row2'><button class='clear' id='fclear'>Clear all</button><button class='apply' id='fapply'>Show results</button></div>";
  $("fp").querySelectorAll(".chipb").forEach(b => b.addEventListener("click", () => {
    const g = b.dataset.g, v = b.dataset.v;
    if (g === "ev") f.min_ev = +v; if (g === "km") f.max_km = +v; if (g === "ord") f.order = v; if (g === "unc") f.hide_unclear = v === "1";
    drawFilters(); }));
  $("fclear").onclick = () => { filters = { min_ev: 0, max_km: 300, order: "near", hide_unclear: false }; drawFilters(); };
  $("fapply").onclick = () => { $("fp").classList.add("hidden"); setValue(Object.assign({ kind: "filters", t: Date.now() }, filters)); };
}
$("filt").addEventListener("click", () => { closeDD(); filters = Object.assign({}, S.filters || {}); drawFilters(); $("fp").classList.toggle("hidden"); });
function renderTop() {
  // Only overwrite the boxes when the server's values changed, so text the user is still choosing is kept
  const u = S.ui || {}, prev = window.__ui || {};
  if ((u.need_value || null) !== (prev.need_value || null) || (u.need_text || "") !== (prev.need_text || ""))
    { need.text = u.need_text || ""; need.value = u.need_value || null; setSeg("need"); }
  if ((u.where_value || null) !== (prev.where_value || null) || (u.where_text || "") !== (prev.where_text || ""))
    { where.text = u.where_text || ""; where.value = u.where_value || null; setSeg("where"); }
  window.__ui = u;
  const f = S.filters || {}, n = (f.min_ev > 0) + (f.max_km < 300) + (f.order === "ev") + (!!f.hide_unclear);
  $("filtLbl").textContent = n ? "Filters (" + n + ")" : "Filters"; $("filt").classList.toggle("on", n > 0);
  const r = S.read; let h = "";
  if (r && r.chosen) h += "<span>Read as <b>" + esc(r.chosen) + "</b></span><span class='tag'>" + esc(r.method || "") + "</span>";
  if (r && !r.chosen && (r.options || []).length) h += "<span class='warnline'>Not sure what is needed. Pick one:</span>";
  if (r) (r.options || []).filter(o => o.service !== r.chosen).forEach(o =>
    h += "<button data-s='" + esc(o.service) + "' title='" + esc(o.reason || "") + "'>" + (r.chosen ? "Use " : "") + esc(o.service) + " · " + esc(o.level) + "</button>");
  (S.notes || []).forEach(n => h += "<span class='warnline'>" + esc(n) + "</span>");
  $("readas").innerHTML = h;
  if (detailId) quoteTag((S.results || []).find(x => x.id === detailId));
  $("readas").querySelectorAll("button[data-s]").forEach(b => b.addEventListener("click", () => setValue({ kind: "use_service", service: b.dataset.s, t: Date.now() })));
}

// ---------------- Render loop ----------------
let geoReady = Promise.all([fetch("india_states.geojson").then(r => r.json()), fetch("india_districts.geojson").then(r => r.json())])
  .then(([s, d]) => {
    s.features.forEach((f, i) => f.properties.__i = String(i)); d.features.forEach((f, i) => f.properties.__i = String(i));
    states = s; districts = d; buildMask();
  }).catch(() => {});
let lastRegionKey = null;
window.addEventListener("message", ev => {
  if (!ev.data || ev.data.type !== "streamlit:render") return;
  S = ev.data.args || {};
  document.body.classList.remove("busy");
  setTheme(!!(ev.data.theme && ev.data.theme.base === "dark"));
  if (S.selected !== window.__lastSel) { window.__lastSel = S.selected; if (S.selected) detailId = S.selected; }
  if (detailId && !(S.results || []).some(x => x.id === detailId)) detailId = null;
  renderTop();
  geoReady.then(() => {
    const rk = (S.service || "") + "|" + JSON.stringify(S.state_counts || {}).length + "|" + (S.results || []).length;
    if (rk !== lastRegionKey) { lastRegionKey = rk; drawRegions(); } else toggleRegions();
    drawPoints(); drawPins(); renderLeft(); fitHeight();
    setTimeout(() => {
      map.invalidateSize();
      if (!window.__started && !S.origin) { window.__started = true; map.fitBounds(INDIA, { padding: [10, 10] }); /* always start on all of India */ }
      drawDemo();
      toggleRegions();
    }, 120);
  });
});
window.addEventListener("resize", () => { fitHeight(); map.invalidateSize(); });
try { window.parent.addEventListener("resize", () => { fitHeight(); map.invalidateSize(); }); } catch (e) {}
send("streamlit:componentReady", { apiVersion: 1 });
</script>
